name: Scheduled Cron Jobs

on:
  schedule:
    - cron: '0 0 * * 1-5'   # 09:00 JST (00:00 UTC) Mon–Fri
    - cron: '0 4 * * 1-5'   # 13:00 JST (04:00 UTC) Mon–Fri
  workflow_dispatch:

jobs:
  morning-prompt:
    if: github.event.schedule == '0 0 * * 1-5' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - name: Trigger morning prompt
        run: |
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" \
            -X POST "${{ secrets.API_URL }}/cron/morning-prompt" \
            -H "X-Cron-Secret: ${{ secrets.CRON_SECRET }}")
          echo "HTTP $STATUS"
          [ "$STATUS" = "200" ] || exit 1

  finalize-votes:
    if: github.event.schedule == '0 4 * * 1-5' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - name: Trigger finalize votes
        run: |
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" \
            -X POST "${{ secrets.API_URL }}/cron/finalize-votes" \
            -H "X-Cron-Secret: ${{ secrets.CRON_SECRET }}")
          echo "HTTP $STATUS"
          [ "$STATUS" = "200" ] || exit 1
